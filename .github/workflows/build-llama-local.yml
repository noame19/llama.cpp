name: Build llama.cpp (ubuntu 22.04 + CUDA 12.6, glibc 2.35 target)

# Two artifacts, both runnable on the target box:
#   Debian 12 / glibc 2.36 / GLIBCXX 3.4.30 / x86-64 AVX2 / NVIDIA driver 615.71.09
#   (Tesla T10 16GB, sm_75), no CUDA toolkit and no libcublas on the box.
#
#   1. llama-<ref>-linux-x64-cuda-full.tar.gz        -> every llama.cpp executable
#   2. llama-<ref>-linux-x64-cuda-server-only.tar.gz -> only llama-server (+ the
#                                                       shared libs it dlopens)
#
# Why this image: the official ubuntu-cuda prebuilt packages are compiled inside
# ubuntu 24.04 (glibc 2.38 + GLIBCXX 3.4.32) and ship cudart/cublas as a separate
# 594 MB bundle, so they cannot run on the target box. ubuntu 22.04 gives glibc
# 2.35 / GLIBCXX 3.4.30 (<= the target), and cudart + cuBLAS are linked
# statically, so the only CUDA runtime dependency left is the driver's
# libcuda.so.1, which the box already has.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "llama.cpp ref to build (tag / branch / commit)"
        required: true
        default: "b11870"
      cuda_archs:
        description: "CMAKE_CUDA_ARCHITECTURES (75 = Turing T4/T10/RTX20, 80/86 = A100/RTX30, 89 = RTX40)"
        required: true
        default: "75-real;89-real"

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  REF: ${{ inputs.ref }}

jobs:
  build:
    name: build ${{ inputs.ref }} (glibc 2.35 / CUDA 12.6)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    container:
      image: nvidia/cuda:12.6.2-devel-ubuntu22.04
    steps:
      - name: Make sure git exists inside the container
        run: |
          if ! command -v git >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates
          fi

      - name: Checkout llama.cpp @ ${{ inputs.ref }}
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Show build environment
        run: |
          echo "== container =="
          head -3 /etc/os-release
          ldd --version | head -1
          echo "== nvcc =="
          nvcc --version | tail -2

      - name: Install toolchain (gcc-12 + recent cmake)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential gcc-12 g++-12 ninja-build python3 python3-pip \
            libssl-dev libgomp1 pkg-config ca-certificates
          python3 -m pip install --no-cache-dir "cmake==3.31.6"
          echo "== versions =="
          gcc-12 --version | head -1
          g++-12 --version | head -1
          cmake --version | head -1

      - name: Link CUDA runtime + cuBLAS statically
        # ggml only uses the static CUDA runtime / static cuBLAS when GGML_STATIC=ON,
        # but GGML_STATIC=ON also adds a global "-static" link option, which cannot
        # work together with the dynamic libcuda.so driver stub. So flip just that
        # one branch: self-contained CUDA deps, dynamic glibc / libstdc++ / libgomp.
        run: |
          python3 - <<'PY'
          import pathlib, sys
          p = pathlib.Path("ggml/src/ggml-cuda/CMakeLists.txt")
          src = p.read_text()
          old = "    if (GGML_STATIC)\n"
          if old not in src:
              sys.exit("FAILED: could not find the GGML_STATIC branch in " + str(p))
          p.write_text(src.replace(old, "    if (GGML_STATIC OR TRUE)  # patched: always static cudart + cublas\n", 1))
          print("patched", p)
          PY
          grep -n "patched: always static" ggml/src/ggml-cuda/CMakeLists.txt

      - name: Configure
        run: |
          # b11870 -> build number 11870, so the server picks up the matching
          # prebuilt web UI from the ggml-org HF bucket
          BUILD_NUMBER="$(echo "$REF" | sed -n 's/^b\([0-9][0-9]*\)$/\1/p')"
          echo "LLAMA_BUILD_NUMBER=${BUILD_NUMBER:-0}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CUDA_HOST_COMPILER=g++-12 \
            -DCMAKE_CUDA_ARCHITECTURES="${{ inputs.cuda_archs }}" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_NCCL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA_CCCL_VERSION=v3.4.3 \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_NUMBER="${BUILD_NUMBER:-0}" \
            -DLLAMA_OPENSSL=ON

      - name: Build every target
        run: cmake --build build --parallel

      - name: Smoke test + compatibility report
        run: |
          # The container has no GPU and no driver. The binaries only need the
          # driver's libcuda.so.1 at load time, so expose the CUDA driver *stub*
          # under that exact soname name and put it on the loader path.
          mkdir -p /tmp/cudastub
          STUB="$(find /usr/local/cuda* -type f -name 'libcuda.so' -path '*stubs*' 2>/dev/null | head -1)"
          echo "driver stub: ${STUB:-<not found>}"
          [ -n "$STUB" ] && ln -sf "$STUB" /tmp/cudastub/libcuda.so.1 || true
          ls -la /tmp/cudastub
          export LD_LIBRARY_PATH="/tmp/cudastub:${LD_LIBRARY_PATH:-}"

          echo "== binaries =="
          ls -la build/bin
          echo "== --version =="
          ./build/bin/llama-cli --version
          ./build/bin/llama-server --version
          echo "== dynamic dependencies of llama-server =="
          ldd build/bin/llama-server | sort
          echo "== RPATH =="
          readelf -d build/bin/llama-server | grep -E "RPATH|RUNPATH" || true
          echo "== required glibc symbols (llama-server + all its .so) =="
          for f in build/bin/llama-server build/bin/lib*.so.*; do
            objdump -T "$f" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?'
          done | sort -Vu | tail -3
          echo "== required GLIBCXX symbols (llama-server + all its .so) =="
          for f in build/bin/llama-server build/bin/lib*.so.*; do
            objdump -T "$f" 2>/dev/null | grep -oE 'GLIBCXX_[0-9]+\.[0-9]+(\.[0-9]+)?'
          done | sort -Vu | tail -3
          echo "== local box for comparison: glibc 2.36 / GLIBCXX 3.4.30 =="

      - name: Package both artifacts
        run: |
          set -eu
          mkdir -p /tmp/cudastub
          STUB="$(find /usr/local/cuda* -type f -name 'libcuda.so' -path '*stubs*' 2>/dev/null | head -1)"
          [ -n "$STUB" ] && ln -sf "$STUB" /tmp/cudastub/libcuda.so.1 || true
          export LD_LIBRARY_PATH="/tmp/cudastub:${LD_LIBRARY_PATH:-}"
          FULL="llama-${REF}-linux-x64-cuda-full"
          SRV="llama-${REF}-linux-x64-cuda-server-only"
          mkdir -p dist

          # smaller payload: drop symbol tables (Release build, no -g)
          find build/bin -maxdepth 1 -type f ! -name '*.so*' -exec strip --strip-unneeded {} + || true
          find build/bin -maxdepth 1 -type f -name '*.so.*' -exec strip --strip-unneeded {} + || true

          echo "== size after strip =="
          du -sh build/bin; du -sh build/bin/libggml-cuda.so.0.27.0 || true

          info() {
            echo "llama.cpp build info"
            echo "  source        : https://github.com/ggml-org/llama.cpp @ ${REF}"
            echo "  commit        : $(git -c safe.directory='*' rev-parse HEAD)"
            echo "  build image   : nvidia/cuda:12.6.2-devel-ubuntu22.04 (glibc $(ldd --version | head -1 | awk '{print $NF}'))"
            echo "  compiler      : $(g++-12 --version | head -1)"
            echo "  cuda toolkit  : $(nvcc --version | tail -2 | head -1 | sed 's/^ *//')"
            echo "  cuda archs    : ${{ inputs.cuda_archs }}"
            echo "  cmake         : $(cmake --version | head -1)"
            echo "  cuda linking  : cudart + cublas STATIC, NCCL off, only libcuda.so.1 at run time"
            echo "  rpath         : \$ORIGIN (binaries and libs must stay in the same directory)"
            echo "  target box    : Debian 12, glibc 2.36, GLIBCXX 3.4.30, AVX2, driver 615.71.09, Tesla T10 (sm_75)"
            echo
            echo "run: ./llama-server -m model.gguf --host 0.0.0.0 --port 8080 -ngl 99"
          }

          # ---- 1) full: every executable + every shared lib
          mkdir -p full
          cp -a build/bin/. full/
          cp -a LICENSE full/ 2>/dev/null || true
          info > full/BUILD-INFO.txt
          ldd build/bin/llama-server | sort > full/ldd.txt
          tar -czf "dist/$FULL.tar.gz" -C full .
          ls -la full | head -20

          # ---- 2) server only: llama-server + exactly the libs it needs
          # llama-server is a thin launcher: it needs the backend .so files that
          # sit next to it (RPATH=$ORIGIN), so they travel with it.
          mkdir -p srv
          cp -a build/bin/llama-server srv/
          cp -a build/bin/lib*.so* srv/
          ls -la srv
          info > srv/BUILD-INFO.txt
          ldd build/bin/llama-server | sort > srv/ldd.txt
          tar -czf "dist/$SRV.tar.gz" -C srv .

          # ---- verify the server-only payload is complete when relocated
          rm -rf /tmp/relocated && mkdir -p /tmp/relocated
          tar -xzf "dist/$SRV.tar.gz" -C /tmp/relocated
          ( cd /tmp/relocated && ./llama-server --version )
          if ldd /tmp/relocated/llama-server | grep "not found"; then
            echo "ERROR: server-only payload has unresolved libraries"; exit 1
          fi
          echo "OK: server-only payload is complete when relocated"
          du -sh srv full; ls -la srv | head -20

          ls -lh dist/*.tar.gz

      - name: Upload full build (all binaries)
        uses: actions/upload-artifact@v7
        with:
          name: llama-${{ inputs.ref }}-linux-x64-cuda-full
          path: dist/llama-${{ inputs.ref }}-linux-x64-cuda-full.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload llama-server only
        uses: actions/upload-artifact@v7
        with:
          name: llama-${{ inputs.ref }}-linux-x64-cuda-server-only
          path: dist/llama-${{ inputs.ref }}-linux-x64-cuda-server-only.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
